<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secuencia de autenticación · ConectaMentes IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f6f3ed; --ink:#193b36; --muted:#58716b; --soft:#8b9a94; --accent:#c66d43; --link:#416f68; --rule:#d8d4ca; --sans:'Geist',system-ui,sans-serif; --serif:'Instrument Serif',serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:48px 24px; color:var(--ink); background:var(--paper); font-family:var(--sans); }
    .frame { width:100%; max-width:1200px; margin:auto; }
    .eyebrow { margin:0 0 8px; color:var(--muted); font:500 12px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0 0 24px; font:400 32px/1.15 var(--serif); }
    svg { display:block; width:100%; min-width:900px; }
    .name { fill:var(--ink); font:600 12px var(--sans); text-anchor:middle; }
    .tech { fill:var(--muted); font:400 8px var(--mono); text-anchor:middle; letter-spacing:.04em; }
    .label { fill:var(--muted); font:400 8px var(--mono); letter-spacing:.04em; }
    .guard { fill:var(--muted); font:400 8px var(--mono); letter-spacing:.04em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">SECUENCIA · FASE 1</p>
    <h1>Registro e inicio de sesión</h1>
    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autenticacion-title autenticacion-desc">
      <title id="autenticacion-title">Secuencia de autenticación</title>
      <desc id="autenticacion-desc">Intercambio entre estudiante, PWA, API y base de datos para registrar una cuenta o iniciar sesión, incluyendo credenciales inválidas.</desc>
      <defs>
        <marker id="auth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#416f68"/></marker>
        <marker id="auth-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c66d43"/></marker>
        <marker id="auth-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#58716b"/></marker>
      </defs>
      <rect width="1000" height="720" fill="#f6f3ed"/>

      <!-- lifelines -->
      <line x1="124" y1="92" x2="124" y2="664" stroke="#8b9a94" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="356" y1="92" x2="356" y2="664" stroke="#8b9a94" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="604" y1="92" x2="604" y2="664" stroke="#8b9a94" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="844" y1="92" x2="844" y2="664" stroke="#8b9a94" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- actors -->
      <rect x="64" y="32" width="120" height="48" rx="6" fill="#fffdf8" stroke="#193b36"/>
      <text x="124" y="56" class="name">Estudiante</text><text x="124" y="68" class="tech">PERSONA</text>
      <rect x="296" y="32" width="120" height="48" rx="6" fill="#fffdf8" stroke="#193b36"/>
      <text x="356" y="56" class="name">Frontend</text><text x="356" y="68" class="tech">REACT PWA</text>
      <rect x="544" y="32" width="120" height="48" rx="6" fill="#fffdf8" stroke="#193b36"/>
      <text x="604" y="56" class="name">API</text><text x="604" y="68" class="tech">ASP.NET CORE 8</text>
      <rect x="784" y="32" width="120" height="48" rx="6" fill="#fffdf8" stroke="#193b36"/>
      <text x="844" y="56" class="name">Base de datos</text><text x="844" y="68" class="tech">PERSISTENCIA</text>

      <!-- activations -->
      <rect x="352" y="136" width="8" height="172" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>
      <rect x="600" y="176" width="8" height="92" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>
      <rect x="840" y="212" width="8" height="32" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>
      <rect x="352" y="392" width="8" height="172" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>
      <rect x="600" y="432" width="8" height="92" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>
      <rect x="840" y="468" width="8" height="32" fill="#193b36" opacity=".12" stroke="#58716b" stroke-width=".8"/>

      <!-- registration happy path -->
      <line x1="124" y1="136" x2="356" y2="136" stroke="#416f68" marker-end="url(#auth-arrow)"/>
      <rect x="184" y="116" width="112" height="12" rx="2" fill="#f6f3ed"/><text x="240" y="125" class="label" text-anchor="middle">POST /registro</text>
      <line x1="356" y1="176" x2="604" y2="176" stroke="#416f68" marker-end="url(#auth-arrow)"/>
      <rect x="418" y="156" width="124" height="12" rx="2" fill="#f6f3ed"/><text x="480" y="165" class="label" text-anchor="middle">datos validados</text>
      <line x1="604" y1="212" x2="844" y2="212" stroke="#416f68" marker-end="url(#auth-arrow)"/>
      <rect x="660" y="192" width="128" height="12" rx="2" fill="#f6f3ed"/><text x="724" y="201" class="label" text-anchor="middle">crear usuario + hash</text>
      <line x1="844" y1="244" x2="604" y2="244" stroke="#58716b" stroke-dasharray="4,3" marker-end="url(#auth-return)"/>
      <rect x="684" y="252" width="80" height="12" rx="2" fill="#f6f3ed"/><text x="724" y="261" class="label" text-anchor="middle">usuario creado</text>
      <line x1="604" y1="268" x2="356" y2="268" stroke="#c66d43" stroke-width="1.2" marker-end="url(#auth-accent)"/>
      <rect x="420" y="276" width="120" height="12" rx="2" fill="#f6f3ed"/><text x="480" y="285" class="label" text-anchor="middle" fill="#c66d43">token + 201</text>
      <line x1="356" y1="308" x2="124" y2="308" stroke="#c66d43" stroke-width="1.2" marker-end="url(#auth-accent)"/>
      <rect x="194" y="316" width="92" height="12" rx="2" fill="#f6f3ed"/><text x="240" y="325" class="label" text-anchor="middle" fill="#c66d43">panel principal</text>

      <!-- invalid login fragment -->
      <rect x="104" y="360" width="800" height="252" rx="4" fill="#193b36" fill-opacity=".025" stroke="#193b36" stroke-opacity=".22"/>
      <rect x="104" y="360" width="40" height="16" rx="2" fill="#f6f3ed" stroke="#193b36" stroke-opacity=".22"/><text x="124" y="372" class="tech" letter-spacing=".12em">ALT</text>
      <text x="156" y="392" class="guard">[credenciales inválidas]</text>
      <line x1="124" y1="432" x2="356" y2="432" stroke="#416f68" marker-end="url(#auth-arrow)"/><rect x="184" y="412" width="112" height="12" rx="2" fill="#f6f3ed"/><text x="240" y="421" class="label" text-anchor="middle">POST /login</text>
      <line x1="356" y1="468" x2="604" y2="468" stroke="#416f68" marker-end="url(#auth-arrow)"/><rect x="426" y="448" width="108" height="12" rx="2" fill="#f6f3ed"/><text x="480" y="457" class="label" text-anchor="middle">verificar hash</text>
      <line x1="604" y1="500" x2="356" y2="500" stroke="#58716b" stroke-dasharray="4,3" marker-end="url(#auth-return)"/><rect x="426" y="508" width="108" height="12" rx="2" fill="#f6f3ed"/><text x="480" y="517" class="label" text-anchor="middle">no coincide</text>
      <line x1="356" y1="536" x2="124" y2="536" stroke="#58716b" stroke-dasharray="4,3" marker-end="url(#auth-return)"/><rect x="184" y="544" width="112" height="12" rx="2" fill="#f6f3ed"/><text x="240" y="553" class="label" text-anchor="middle">error accesible</text>
      <line x1="124" y1="580" x2="356" y2="580" stroke="#416f68" marker-end="url(#auth-arrow)"/><rect x="180" y="588" width="120" height="12" rx="2" fill="#f6f3ed"/><text x="240" y="597" class="label" text-anchor="middle">reintento</text>

      <line x1="40" y1="668" x2="960" y2="668" stroke="#d8d4ca"/>
      <text x="40" y="692" fill="#58716b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">LEYENDA</text>
      <line x1="120" y1="688" x2="160" y2="688" stroke="#416f68" marker-end="url(#auth-arrow)"/><text x="172" y="692" class="tech" text-anchor="start">solicitud</text>
      <line x1="256" y1="688" x2="296" y2="688" stroke="#58716b" stroke-dasharray="4,3" marker-end="url(#auth-return)"/><text x="308" y="692" class="tech" text-anchor="start">respuesta</text>
      <line x1="400" y1="688" x2="440" y2="688" stroke="#c66d43" marker-end="url(#auth-accent)"/><text x="452" y="692" class="tech" text-anchor="start">éxito</text>
    </svg>
  </main>
</body>
</html>
