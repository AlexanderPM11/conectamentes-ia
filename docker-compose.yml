services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "3306"
    networks:
      - app_network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./Backend
      dockerfile: ConectaMentes.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORTS:-8080}
      ConnectionStrings__Default: server=mysql;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-ConectaMentes.Api}
      Jwt__Audience: ${Jwt__Audience:-ConectaMentes.Frontend}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      Google__ClientId: ${Google__ClientId}
      Admin__Email: ${Admin__Email:-}
      Admin__Password: ${Admin__Password:-}
      Admin__DisplayName: ${Admin__DisplayName:-Superadministrador}
      ChatUploads__Path: ${ChatUploads__Path:-/app/data/chat-uploads}
      ChatUploads__MaxBytes: ${ChatUploads__MaxBytes:-10485760}
      DisableHttpsRedirection: ${DisableHttpsRedirection:-true}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - chat_uploads:/app/data/chat-uploads
      - api_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - app_network

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - app_network

volumes:
  mysql_data:
  chat_uploads:
  api_keys:

networks:
  app_network:
    driver: bridge
